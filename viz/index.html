<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <title>Mini World Model — CartPole</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; overflow: hidden; font-family: system-ui, sans-serif; }
    canvas { display: block; }
    #divider {
      position: fixed; left: 50%; top: 0;
      width: 2px; height: 100%;
      background: linear-gradient(to bottom, transparent, rgba(255,255,255,0.2) 30%, rgba(255,255,255,0.2) 70%, transparent);
      pointer-events: none;
    }
    .label {
      position: fixed; top: 24px;
      display: flex; flex-direction: column; align-items: center; gap: 5px;
      pointer-events: none;
    }
    .label .title { font-size: 1rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; }
    .label .sub   { font-size: 0.68rem; letter-spacing: 0.04em; opacity: 0.6; }
    #label-left  { left: 0; width: 50%; color: #55ffaa; }
    #label-right { left: 50%; width: 50%; color: #ff6655; }
    .fallen-text {
      position: fixed; left: 50%; width: 50%;
      top: 50%; transform: translateY(-50%);
      text-align: center; color: #ff4433;
      font-size: 1.4rem; font-weight: 800; letter-spacing: 0.1em;
      text-transform: uppercase; opacity: 0;
      transition: opacity 0.3s;
      pointer-events: none;
    }
    .fallen-text.visible { opacity: 1; }
  </style>
</head>
<body>
<div id="divider"></div>
<div class="label" id="label-left">
  <span class="title">AC-JEPA World Model</span>
  <span class="sub">Planner imagines the future · pole stays up</span>
</div>
<div class="label" id="label-right">
  <span class="title">Untrained Model</span>
  <span class="sub">Random weights · planner is blind</span>
</div>
<div class="fallen-text" id="fallen-text">FAILED</div>

<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.165.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

const [{ frames: framesGood }, { frames: framesBad }] = await Promise.all([
  fetch('./trajectory.json').then(r => r.json()),
  fetch('./trajectory_untrained.json').then(r => r.json()),
]);

// ── Renderer ─────────────────────────────────────────────────────────────────
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.autoClear = false;
document.body.appendChild(renderer.domElement);

// ── Single shared scene ───────────────────────────────────────────────────────
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0xd4854a, 18, 40);

// Sky gradient background
const skyCanvas = document.createElement('canvas');
skyCanvas.width = 2; skyCanvas.height = 512;
const skyCtx = skyCanvas.getContext('2d');
const skyGrad = skyCtx.createLinearGradient(0, 0, 0, 512);
skyGrad.addColorStop(0.00, '#1a3d72');
skyGrad.addColorStop(0.40, '#3a7ac0');
skyGrad.addColorStop(0.72, '#e8934a');
skyGrad.addColorStop(1.00, '#c45520');
skyCtx.fillStyle = skyGrad; skyCtx.fillRect(0, 0, 2, 512);
scene.background = new THREE.CanvasTexture(skyCanvas);

// Lighting
scene.add(new THREE.HemisphereLight(0x6699cc, 0xcc9944, 1.0));
const sun = new THREE.DirectionalLight(0xffcc77, 3.0);
sun.position.set(12, 8, -6);
scene.add(sun);
const fill = new THREE.DirectionalLight(0x8899bb, 0.5);
fill.position.set(-6, 4, 4);
scene.add(fill);

// Sun disc
const sunDisc = new THREE.Mesh(
  new THREE.SphereGeometry(0.55, 12, 12),
  new THREE.MeshBasicMaterial({ color: 0xffee88 })
);
sunDisc.position.set(18, 9, -30);
scene.add(sunDisc);

// Desert floor
const ground = new THREE.Mesh(
  new THREE.PlaneGeometry(80, 60),
  new THREE.MeshStandardMaterial({ color: 0xc4944a, roughness: 0.95 })
);
ground.rotation.x = -Math.PI / 2;
ground.position.y = -0.18;
scene.add(ground);

// Mesas (layer 0 — both cameras see them)
[
  [-18, -22, 3.2, 2.2, 5.5, 0x9b4422],
  [ 14, -28, 4.5, 3.0, 7.2, 0x8b3a1e],
  [  2, -35, 6.0, 4.5, 9.0, 0xa04428],
  [-28, -18, 2.5, 1.8, 4.0, 0xb85030],
  [ 26, -20, 3.8, 2.6, 6.0, 0x924020],
  [-10, -11, 1.2, 0.9, 2.2, 0xaa6633],
  [ 11, -12, 1.0, 0.7, 1.8, 0x9a5a2a],
].forEach(([x, z, bR, tR, h, col]) => {
  const body = new THREE.Mesh(
    new THREE.CylinderGeometry(tR, bR, h, 7),
    new THREE.MeshStandardMaterial({ color: col, roughness: 0.9 })
  );
  body.position.set(x, -0.18 + h / 2, z);
  scene.add(body);
  const cap = new THREE.Mesh(
    new THREE.CylinderGeometry(tR * 1.02, tR * 1.02, 0.08, 7),
    new THREE.MeshStandardMaterial({ color: new THREE.Color(col).multiplyScalar(0.7), roughness: 1.0 })
  );
  cap.position.set(x, -0.18 + h + 0.04, z);
  scene.add(cap);
});

// Rails + sleepers
const railMat = new THREE.MeshStandardMaterial({ color: 0x556677, metalness: 0.9, roughness: 0.15 });
[-0.14, 0.14].forEach(z => {
  const rail = new THREE.Mesh(new THREE.BoxGeometry(10, 0.05, 0.06), railMat);
  rail.position.set(0, -0.03, z);
  scene.add(rail);
});
const tieMat = new THREE.MeshStandardMaterial({ color: 0x5a3a1a, roughness: 0.95 });
for (let i = -7; i <= 7; i++) {
  const tie = new THREE.Mesh(new THREE.BoxGeometry(0.1, 0.04, 0.5), tieMat);
  tie.position.set(i * 0.65, -0.05, 0);
  scene.add(tie);
}

// ── Cart builder — objects on a specific layer ────────────────────────────────
function buildCart(layer, glowColor) {
  const L = layer;
  function add(mesh) { mesh.layers.set(L); scene.add(mesh); return mesh; }
  function obj3d() { const o = new THREE.Object3D(); o.layers.set(L); scene.add(o); return o; }

  const group = new THREE.Group();
  group.layers.set(L);
  scene.add(group);

  // Body
  const body = new THREE.Mesh(
    new THREE.BoxGeometry(0.72, 0.30, 0.52),
    new THREE.MeshStandardMaterial({ color: 0x7a5a28, roughness: 0.7, metalness: 0.1 })
  );
  body.position.y = 0.11;
  body.layers.set(L);
  group.add(body);

  // Wheels
  const rimMat = new THREE.MeshStandardMaterial({ color: 0x443322, metalness: 0.6, roughness: 0.4 });
  const hubMat = new THREE.MeshStandardMaterial({ color: 0x665533, metalness: 0.5, roughness: 0.5 });
  [[-0.28, -0.19], [0.28, -0.19], [-0.28, 0.19], [0.28, 0.19]].forEach(([x, z]) => {
    const rim = new THREE.Mesh(new THREE.TorusGeometry(0.10, 0.018, 8, 16), rimMat);
    const hub = new THREE.Mesh(new THREE.CylinderGeometry(0.03, 0.03, 0.07, 8), hubMat);
    rim.rotation.y = Math.PI / 2;
    hub.rotation.x = Math.PI / 2;
    rim.position.set(x, -0.02, z);
    hub.position.set(x, -0.02, z);
    rim.layers.set(L); hub.layers.set(L);
    group.add(rim); group.add(hub);
  });

  // Pivot sphere
  const pivotMesh = new THREE.Mesh(
    new THREE.SphereGeometry(0.065, 12, 12),
    new THREE.MeshStandardMaterial({ color: 0x99bbcc, metalness: 0.8, roughness: 0.2 })
  );
  pivotMesh.position.y = 0.285;
  pivotMesh.layers.set(L);
  group.add(pivotMesh);

  // Pole pivot (parented to group)
  const polePivot = new THREE.Object3D();
  polePivot.layers.set(L);
  polePivot.position.set(0, 0.285, 0);
  group.add(polePivot);

  const POLE_LEN = 1.55;
  const pole = new THREE.Mesh(
    new THREE.CylinderGeometry(0.022, 0.034, POLE_LEN, 12),
    new THREE.MeshStandardMaterial({ color: 0xddaa44, emissive: 0x886611, emissiveIntensity: 0.25, metalness: 0.4, roughness: 0.35 })
  );
  pole.position.y = POLE_LEN / 2;
  pole.layers.set(L);
  polePivot.add(pole);

  const ball = new THREE.Mesh(
    new THREE.SphereGeometry(0.058, 12, 12),
    new THREE.MeshStandardMaterial({ color: glowColor, emissive: glowColor, emissiveIntensity: 0.9, roughness: 0.2 })
  );
  ball.position.y = POLE_LEN;
  ball.layers.set(L);
  polePivot.add(ball);

  const glow = new THREE.PointLight(glowColor, 2.2, 3.5);
  glow.position.y = POLE_LEN;
  glow.layers.set(L);
  polePivot.add(glow);

  // Trail meshes (in scene, not group, so we can read world positions)
  const TRAIL = 14;
  const trail = Array.from({ length: TRAIL }, (_, i) => {
    const m = new THREE.Mesh(
      new THREE.SphereGeometry(0.026 - 0.010 * i / TRAIL, 5, 5),
      new THREE.MeshBasicMaterial({ color: glowColor, transparent: true, opacity: 0.48 - 0.42 * i / TRAIL })
    );
    m.layers.set(L);
    scene.add(m);
    return m;
  });

  return { group, polePivot, glow, trail };
}

// Layer 1 = world model cart (camL sees layer 0 + 1)
// Layer 2 = random cart (camR sees layer 0 + 2)
const cartL = buildCart(1, 0x44ffaa);
const cartR = buildCart(2, 0xff4444);

// ── Two cameras ───────────────────────────────────────────────────────────────
function makeCamera(extraLayer) {
  const cam = new THREE.PerspectiveCamera(42, (window.innerWidth / 2) / window.innerHeight, 0.1, 200);
  cam.position.set(0, 1.4, 9);
  cam.lookAt(0, 1.0, 0);
  cam.layers.enable(extraLayer);
  return cam;
}
const camL = makeCamera(1);
const camR = makeCamera(2);

// ── Animation ─────────────────────────────────────────────────────────────────
const SCALE = 2.8 / 2.4;
const MS_PER_FRAME = 1000 / 30;
const FALL_FRAMES = 22;   // frames to animate pole → flat
const HOLD_FRAMES = 45;   // frames to hold flat before reset
let fi = 0, lastT = 0;
let badFi = 0;
// phases: 'run' | 'fall' | 'hold'
let badPhase = 'run', phaseCount = 0;
let fallStartZ = 0, fallTargetZ = 0, fallCartX = 0;
const tmpVec = new THREE.Vector3();
const fallenEl = document.getElementById('fallen-text');

function updateCart({ group, polePivot, glow, trail }, cartX, rotZ, cam) {
  const wx = cartX * SCALE;
  group.position.x = wx;
  polePivot.rotation.z = rotZ;
  cam.position.x += (wx * 0.25 - cam.position.x) * 0.05;
  cam.lookAt(cam.position.x * 0.4, 1.0, 0);
  glow.getWorldPosition(tmpVec);
  for (let i = trail.length - 1; i > 0; i--) trail[i].position.copy(trail[i - 1].position);
  trail[0].position.copy(tmpVec);
}

function easeIn(t) { return t * t; }

function animate(t) {
  requestAnimationFrame(animate);
  if (t - lastT < MS_PER_FRAME) return;
  lastT = t;

  // Good cart — loops forever
  const frameGood = framesGood[fi % framesGood.length];
  fi++;
  updateCart(cartL, frameGood.cart_x, -frameGood.pole_angle, camL);

  // Bad cart — run → fall → hold → reset
  if (badPhase === 'run') {
    const frame = framesBad[badFi];
    updateCart(cartR, frame.cart_x, -frame.pole_angle, camR);
    badFi++;
    if (badFi >= framesBad.length) {
      // Transition to fall phase
      const last = framesBad[framesBad.length - 1];
      fallStartZ = -last.pole_angle;
      fallTargetZ = -Math.sign(last.pole_angle || 1) * (Math.PI / 2);
      fallCartX = last.cart_x;
      badPhase = 'fall';
      phaseCount = 0;
      fallenEl.classList.remove('visible');
    }
  } else if (badPhase === 'fall') {
    const progress = easeIn(phaseCount / FALL_FRAMES);
    const rotZ = fallStartZ + (fallTargetZ - fallStartZ) * progress;
    updateCart(cartR, fallCartX, rotZ, camR);
    phaseCount++;
    if (phaseCount >= FALL_FRAMES) {
      badPhase = 'hold';
      phaseCount = 0;
      fallenEl.classList.add('visible');
    }
  } else {
    // hold — frozen flat
    updateCart(cartR, fallCartX, fallTargetZ, camR);
    phaseCount++;
    if (phaseCount >= HOLD_FRAMES) {
      badPhase = 'run';
      badFi = 0;
      phaseCount = 0;
      fallenEl.classList.remove('visible');
    }
  }


  const W = window.innerWidth, H = window.innerHeight, hw = Math.floor(W / 2);

  renderer.clear();
  renderer.setScissorTest(true);

  renderer.setViewport(0, 0, hw, H);
  renderer.setScissor(0, 0, hw, H);
  renderer.render(scene, camL);

  renderer.setViewport(hw, 0, W - hw, H);
  renderer.setScissor(hw, 0, W - hw, H);
  renderer.render(scene, camR);
}
requestAnimationFrame(animate);

window.addEventListener('resize', () => {
  const W = window.innerWidth, H = window.innerHeight;
  renderer.setSize(W, H);
  [camL, camR].forEach(c => { c.aspect = (W / 2) / H; c.updateProjectionMatrix(); });
});
</script>
</body>
</html>
